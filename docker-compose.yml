services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: capyreview
      POSTGRES_USER: capyreview
      POSTGRES_PASSWORD: capyreview-local
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capyreview"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  capyreview:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CAPYREVIEW_HOST: 0.0.0.0
      CAPYREVIEW_DATABASE_URL: postgresql://capyreview:capyreview-local@postgres:5432/capyreview
      CAPYREVIEW_REDIS_URL: redis://redis:6379/0
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15

volumes:
  postgres_data:
  redis_data:
